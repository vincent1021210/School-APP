name: Daily today contact-book sync

on:
  schedule:
    # 台北 00:10 / 06:00 / 07:00 / 08:00 / 12:00 / 16:00 / 18:00
    - cron: '10 16 * * *' # 00:10 Taipei
    - cron: '0 22 * * *'  # 06:00 Taipei（寄送聯絡簿）
    - cron: '0 23 * * *'  # 07:00 Taipei
    - cron: '0 0 * * *'   # 08:00 Taipei
    - cron: '0 4 * * *'   # 12:00 Taipei
    - cron: '0 8 * * *'   # 16:00 Taipei
    - cron: '0 10 * * *'  # 18:00 Taipei
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Scrape legacy board and import today
        env:
          LEGACY_BOARD_URL: https://script.google.com/macros/s/AKfycbwBE0IVr9JuF92lpHMTUQiTgIpjxBYZWidAXHEfICwumlHggm31kfbD3Y3_mlznVuES/exec
          GAS_EXEC_URL: https://script.google.com/macros/s/AKfycbzDgh4ktlDeGvf8RudOBtroV2QxvP8f0HoLn2xLN9nweESntGMSYfM836LEADbop60KJg/exec
          SCRAPE_TOKEN: ${{ secrets.SCHOOL_APP_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SCRAPE_TOKEN}" ]; then
            export SCRAPE_TOKEN='school-app-legacy-scrape-v1'
          fi
          node scripts/scrape-legacy-board.mjs
          echo
          echo "Verifying getDailySummary..."
          curl -fsSL --max-time 60 "${GAS_EXEC_URL}?action=getDailySummary" | tee summary.json
          python3 - <<'PY'
          import json
          scrape = json.load(open('legacy-scrape.json', encoding='utf-8'))
          summary = json.load(open('summary.json', encoding='utf-8'))
          print(
              'scraped_ok=', scrape.get('ok'),
              'scraped=', scrape.get('noticeCount'),
              'imported=', (scrape.get('import') or {}).get('noticeCount'),
              'summary=', len(summary.get('notices') or []),
              'date=', summary.get('dateLabel'),
          )
          if scrape.get('error'):
              print('scrape warning:', scrape.get('error'))
          if not summary.get('dateLabel') and not summary.get('notices'):
              raise SystemExit(f"GAS summary missing: {summary}")
          PY

      - name: Email today's contact book at 06:00 Taipei
        if: github.event.schedule == '0 22 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GAS_EXEC_URL: https://script.google.com/macros/s/AKfycbzDgh4ktlDeGvf8RudOBtroV2QxvP8f0HoLn2xLN9nweESntGMSYfM836LEADbop60KJg/exec
          SCRAPE_TOKEN: ${{ secrets.SCHOOL_APP_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${SCRAPE_TOKEN:-school-app-legacy-scrape-v1}"
          curl -fsSL --max-time 90 "${GAS_EXEC_URL}?action=sendDailyMail&token=${TOKEN}" | tee mail-result.json
          python3 - <<'PY'
          import json
          data = json.load(open('mail-result.json', encoding='utf-8'))
          if data.get('error') and not data.get('ok'):
              raise SystemExit(f"mail error: {data}")
          print('sent=', data.get('sent'), 'failed=', data.get('failed'), 'date=', data.get('dateLabel'))
          PY
