name: Daily contact-book email 06:00

on:
  schedule:
    - cron: '0 22 * * *' # 06:00 Taipei
  workflow_dispatch:

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        continue-on-error: true
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Scrape legacy board if possible
        continue-on-error: true
        env:
          LEGACY_BOARD_URL: https://script.google.com/macros/s/AKfycbwBE0IVr9JuF92lpHMTUQiTgIpjxBYZWidAXHEfICwumlHggm31kfbD3Y3_mlznVuES/exec
          GAS_EXEC_URL: https://script.google.com/macros/s/AKfycbzDgh4ktlDeGvf8RudOBtroV2QxvP8f0HoLn2xLN9nweESntGMSYfM836LEADbop60KJg/exec
          SCRAPE_TOKEN: ${{ secrets.SCHOOL_APP_SYNC_TOKEN }}
        run: |
          if [ -z "${SCRAPE_TOKEN}" ]; then
            export SCRAPE_TOKEN='school-app-legacy-scrape-v1'
          fi
          node scripts/scrape-legacy-board.mjs || true

      - name: Skip GitHub mail (sent by Apps Script trigger)
        run: echo "Daily mail is sent by the patspats799 Apps Script 06:00 trigger."
